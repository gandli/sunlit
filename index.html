<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sunlit</title>
  <style>
    /* Sunlit Adaptation - Improved Dappled Sunlight
     * Adapted from https://www.allaboutken.com/posts/sunlit-dappled-light-effect/
     * Two-layer additive blending approach
     */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100%;
    }

    body {
      min-height: 200vh;
      background-color: var(--light);
    }

    :root {
      --day: #fffdfa;
      --evening: #fccc83;
      --dusk: #db7a2a;
      --night: #0f131c;
      --dawn: #16132b;
      --morning: #9fb3bf;
      --light: var(--night);
      --dark: var(--day);
    }

    /* Main container - two layers with additive blending */
    #kh-dappled-light {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      aria-hidden: true;
    }

    /* Layer 1: Leaves with SVG turbulence wind animation */
    .kh-ambience-leaves {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      background-image: url(https://raw.githubusercontent.com/jackyzha0/sunlit/main/leaves.png);
      background-size: cover;
      background-repeat: no-repeat;
      background-position: bottom right;
      filter: url(%23wind) blur(9px);
      mix-blend-mode: plus-lighter;
      opacity: 0.07;

      @media (max-width: 768px) {
        opacity: 0.1;
      }

      /* Firefox has performance issues with feDisplacementMap */
      @-moz-document url-prefix() {
        display: none;
      }
    }

    /* Layer 2: Perspective blinds - vertical stripes with perspective */
    .kh-ambience-blinds {
      position: absolute;
      inset: 0;
      top: -30vh;
      right: 0;
      width: 80vw;
      height: 130vh;
      transform-origin: top right;
      transform-style: preserve-3d;
      transform: matrix3d(
        0.7500, -0.0625, 0.0000, 0.0008,
        0.0000, 1.0000, 0.0000, 0.0000,
        0.0000, 0.0000, 1.0000, 0.0000,
        0.0000, 0.0000, 0.0000, 1.0000
      );
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 40px,
        rgba(255, 255, 255, 0.12) 40px,
        rgba(255, 255, 255, 0.12) 48px
      );
      mix-blend-mode: plus-lighter;
      animation: kh-parallax 11s ease-in-out infinite alternate;
    }

    /* Slow parallax animation */
    @keyframes kh-parallax {
      0% {
        transform: matrix3d(
          0.7500, -0.0625, 0.0000, 0.0008,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000
        ) translateY(0);
      }
      100% {
        transform: matrix3d(
          0.7500, -0.0625, 0.0000, 0.0008,
          0.0000, 1.0000, 0.0000, 0.0000,
          0.0000, 0.0000, 1.0000, 0.0000,
          0.0000, 0.0000, 0.0000, 1.0000
        ) translateY(20px);
      }
    }

    /* Scroll-driven opacity fade - fades out as you scroll down */
    @media (prefers-reduced-motion: no-preference) {
      html {
        scroll-behavior: smooth;
      }
      #kh-dappled-light {
        animation: kh-fade-out linear;
        animation-timeline: scroll(root);
      }
    }

    @keyframes kh-fade-out {
      from { opacity: 0.9; }
      to   { opacity: 0.3; }
    }

    /* Content */
    article {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      max-width: 768px;
      padding: 40vh 1.5rem;
      isolation: isolate;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 2rem;
      color: var(--dark);
    }

    p {
      font-size: 1.5rem;
      line-height: 1.6;
      color: var(--dark);
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    p:last-of-type {
      font-size: 1.125rem;
      font-family: monospace;
      margin-top: 0.8rem;
    }

    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
      font-size: 0.9em;
    }

    a {
      color: var(--dark);
      text-decoration: underline;
    }

    .credit {
      margin-top: 4rem;
      font-size: 1rem;
      opacity: 0.7;
    }

    /* Accessibility */
    @media (prefers-contrast: more) {
      #kh-dappled-light {
        display: none;
      }
      body {
        background: #000;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="kh-dappled-light" aria-hidden="true">
    <div class="kh-ambience-leaves">
      <!-- SVG filter for wind animation -->
      <svg style="position: absolute; width: 0; height: 0;">
        <defs>
          <filter id="wind" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" numOctaves="2" seed="1">
              <animate attributeName="baseFrequency" dur="16s" keyTimes="0;0.33;0.66;1"
                values="0.005 0.003;0.01 0.009;0.008 0.004;0.005 0.003" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic">
              <animate attributeName="scale" dur="20s" keyTimes="0;0.25;0.5;0.75;1" values="45;55;75;55;45"
                repeatCount="indefinite" />
            </feDisplacementMap>
          </filter>
        </defs>
      </svg>
    </div>
    <div class="kh-ambience-blinds"></div>
  </div>

  <article>
    <h1>sunlit</h1>
    <p>
      inspired by <a href="https://daylightcomputer.com/">daylight computer</a> and <a href="https://www.chloeyan.me/">chloe yan's</a> <a href="https://www.sunlit.place/">sunlit place</a>
    </p>
    <p>
      <strong>adaptation:</strong> improved two‑layer <code>plus‑lighter</code> blending from <a href="https://www.allaboutken.com/posts/sunlit-dappled-light-effect/">Ken Hawkins</a>
    </p>
  </article>

</body>
</html>
