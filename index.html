<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sunlit</title>
  <style>
    /*
     * sunlit adaptation — Zero JavaScript version
     * Based on original jackyzha0/sunlit
     * https://github.com/jackyzha0/sunlit
     */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100%;
    }

    body {
      --day: #fffdfa;
      --evening: #fccc83;
      --dusk: #db7a2a;
      --night: #0f131c;
      --dawn: #16132b;
      --morning: #9fb3bf;
      --light: var(--night);
      --dark: var(--day);
      --shadow: #030307;
      --bounce-light: #1b293f;

      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: var(--light);
      min-height: 100vh;
    }

    /* Main container */
    #dappled-light {
      pointer-events: none;
      position: fixed;
      height: 100vh;
      width: 100vw;
      z-index: 0;
    }

    /* Glow layers - original two glow layers */
    #glow {
      position: absolute;
      background: linear-gradient(309deg, var(--bounce-light), var(--bounce-light) 20%, transparent);
      height: 100%;
      width: 100%;
      opacity: 0.5;
    }

    #glow-bounce {
      content: "";
      position: absolute;
      background: linear-gradient(355deg, var(--bounce-light) 0%, transparent 30%, transparent 100%);
      opacity: 0.5;
      height: 100%;
      width: 100%;
      bottom: 0;
    }

    /* Perspective container for leaves and blinds */
    .perspective {
      position: absolute;
      top: -30vh;
      right: 0;
      width: 80vw;
      height: 130vh;
      opacity: 0.3; /* dark mode default */
      background-blend-mode: darken;
      transform-origin: top right;
      transform-style: preserve-3d;
      transform: matrix3d(
        0.8333, 0.0833, 0.0000, 0.0003,
        0.0000, 1.0000, 0.0000, 0.0000,
        0.0000, 0.0000, 1.0000, 0.0000,
        0.0000, 0.0000, 0.0000, 1.0000
      );
    }

    /* Leaves layer */
    #leaves {
      position: absolute;
      background-size: cover;
      background-repeat: no-repeat;
      bottom: -20px;
      right: -700px;
      width: 1600px;
      height: 1400px;
      background-image: url(https://raw.githubusercontent.com/jackyzha0/sunlit/main/leaves.png);
      filter: url(#wind);
      mix-blend-mode: multiply;
      animation: billow 8s ease-in-out infinite;
    }

    @keyframes billow {
      0% {
        transform: perspective(400px) rotateX(0deg) rotateY(0deg) scale(1);
      }
      25% {
        transform: perspective(400px) rotateX(1deg) rotateY(2deg) scale(1.02);
      }
      50% {
        transform: perspective(400px) rotateX(-4deg) rotateY(-2deg) scale(0.97);
      }
      75% {
        transform: perspective(400px) rotateX(1deg) rotateY(-1deg) scale(1.04);
      }
      100% {
        transform: perspective(400px) rotateX(0deg) rotateY(0deg) scale(1);
      }
    }

    /* Blinds - replaced 23 DOM elements with pure CSS gradient */
    #blinds {
      position: relative;
      width: 100%;
      height: 100%;
      /* Vertical bars using repeating-linear-gradient */
      background: repeating-linear-gradient(
        90deg,
        transparent 0px,
        transparent 40px,
        var(--shadow) 40px,
        var(--shadow) 46px
      );
      mix-blend-mode: multiply;
    }

    /* Progressive blur - 4 layers increasing blur */
    #progressive-blur {
      position: absolute;
      height: 100%;
      width: 100%;
      inset: 0;

      @media (prefers-reduced-motion: no-preference) {
        animation: progressive-blur-scroll linear;
        animation-timeline: scroll(root);
      }
    }

    #progressive-blur > div {
      position: absolute;
      height: 100%;
      width: 100%;
      inset: 0;
      backdrop-filter: blur(var(--blur-amount));
      mask-image: linear-gradient(to top, transparent, black);
      -webkit-mask-image: linear-gradient(to top, transparent, black);
    }

    #progressive-blur > div:nth-child(1) {
      --blur-amount: 6px;
    }

    #progressive-blur > div:nth-child(2) {
      --blur-amount: 12px;
    }

    #progressive-blur > div:nth-child(3) {
      --blur-amount: 48px;
    }

    #progressive-blur > div:nth-child(4) {
      --blur-amount: 96px;
    }

    @keyframes progressive-blur-scroll {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* Content - aligned to original sunlit.pages.dev */
    article {
      position: relative;
      z-index: 1;
      margin: 0 auto;
      max-width: 800px;
      padding: 40vh 0;
      color: var(--dark);
      isolation: isolate;
    }

    article h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 2rem;
    }

    article p {
      font-size: 1.5rem;
      line-height: 1.6;
      margin-bottom: 1rem;
      opacity: 0.9;
    }

    article pre {
      font-size: 1.125rem;
      font-family: monospace;
      margin-top: 0.8rem;
      opacity: 0.8;
    }

    article a {
      color: var(--dark);
      text-decoration: underline;
    }

    code {
      background: rgba(255, 255, 255, 0.1);
      padding: 0.2em 0.4em;
      border-radius: 4px;
      font-family: ui-monospace, monospace;
    }

    /* Accessibility */
    @media (prefers-contrast: more) {
      #dappled-light {
        display: none;
      }
      body {
        background: #000;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
      }
    }
  </style>
</head>
<body>
  <div id="dappled-light">
    <div id="glow"></div>
    <div id="glow-bounce"></div>
    <div class="perspective">
      <div id="leaves">
        <svg style="width: 0; height: 0; position: absolute;">
          <defs>
            <filter id="wind" x="-20%" y="-20%" width="140%" height="140%">
              <feTurbulence type="fractalNoise" numOctaves="2" seed="1">
                <animate attributeName="baseFrequency" dur="16s" keyTimes="0;0.33;0.66;1"
                  values="0.005 0.003;0.01 0.009;0.008 0.004;0.005 0.003" repeatCount="indefinite" />
              </feTurbulence>
              <feDisplacementMap in="SourceGraphic">
                <animate attributeName="scale" dur="20s" keyTimes="0;0.25;0.5;0.75;1" values="45;55;75;55;45"
                  repeatCount="indefinite" />
              </feDisplacementMap>
            </filter>
          </defs>
        </svg>
      </div>
      <div id="blinds"></div>
    </div>
    <div id="progressive-blur">
      <div></div>
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

  <article>
    <h1>sunlit</h1>
    <p>inspired by <a href="https://daylightcomputer.com/">daylight computer</a> and <a href="https://www.chloeyan.me/">chloe yan's</a> <a href="https://www.sunlit.place/">sunlit place</a></p>
    <pre>[click or press <code>space</code> to toggle the sun]</pre>
  </article>

  <script>
    // Minimal toggle script - zero JS for effect, only for user interaction toggle
    let dark = true;
    function toggle() {
      dark = !dark;
      if (dark) {
        document.body.style.setProperty('--light', 'var(--night)');
        document.body.style.setProperty('--dark', 'var(--day)');
        document.body.style.setProperty('--shadow', '#030307');
        document.body.style.setProperty('--bounce-light', '#1b293f');
      } else {
        document.body.style.setProperty('--light', 'var(--day)');
        document.body.style.setProperty('--dark', 'var(--night)');
        document.body.style.setProperty('--shadow', '#1a1917');
        document.body.style.setProperty('--bounce-light', '#f5d7a6');
      }
    }
    document.addEventListener('keydown', e => {
      if (e.keyCode === 32) { toggle(); e.preventDefault(); }
    });
    document.addEventListener('click', toggle);
  </script>
</body>
</html>
